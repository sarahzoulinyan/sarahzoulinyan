name: Update all-years contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate graph from GitHub contribution history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_contribution_graph.py --username sarahzoulinyan --output assets/contribution-history.svg
      - name: Commit a changed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-history.svg
          git diff --cached --quiet || git commit -m "Update contribution history graph"
          git push
